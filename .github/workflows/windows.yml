name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python tools/make_icon.py
      - run: pyinstaller --noconfirm --windowed --name PyCraft --icon assets/icon.ico --add-data "launcher/ui/qml;launcher/ui/qml" --collect-all PySide6 main.py
      - run: choco install innosetup -y
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PyCraft-Setup
          path: Output/PyCraft-Setup.exe